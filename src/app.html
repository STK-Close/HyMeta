<title>HyMeta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a game storefront at night. One cinematic key-art banner per screen, compact rows on
   phones and a tight grid on wide screens, white (or lifted navy) cards on a tinted page so
   every card reads as an object. Hot pink is saved for warnings and experimental packs. */
:root{
  --bg:#d9e3ef; --bg2:#ffffff; --bg3:#edf2f8; --line:#74869f; --line-soft:#c0ccdb;
  --fg:#121930; --muted:#3a4461;
  --gold:#f2b94b; --gold-ink:#1d1503; --gold-deep:#a8771a;
  --link:#1c3fa8; --pink-text:#a30d54; --good:#0a6236; --warm:#8a5300; --focus:#0b5cad;
  --edge:#b0bfd1; --shade:rgba(18,25,48,.30);
  --tape:#ff5aa5; --tape-ink:#2a0016; --hazard:#ffd93b; --hazard-ink:#221a00;
  --art-bg:#1b2140; --art-ink:#fffdf2; --art-veil:rgba(9,11,24,.80);
  --display:"Grandstander","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabs-h:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1223; --bg2:#1a2143; --bg3:#252d5a; --line:#6672b8; --line-soft:#343d70;
    --fg:#eef1fb; --muted:#b9c1de;
    --link:#9dbbff; --pink-text:#ff8cc2; --good:#6fe0a0; --warm:#f2b94b; --focus:#4fe3d4;
    --edge:#06080f; --shade:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1223; --bg2:#1a2143; --bg3:#252d5a; --line:#6672b8; --line-soft:#343d70;
  --fg:#eef1fb; --muted:#b9c1de;
  --link:#9dbbff; --pink-text:#ff8cc2; --good:#6fe0a0; --warm:#f2b94b; --focus:#4fe3d4;
  --edge:#06080f; --shade:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.5 var(--body);margin:0}
h1,h2,h3,h4,p,ul{margin:0}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.6rem,5vw,2.25rem);font-weight:900}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.0625rem;font-weight:700}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.small{font-size:.8125rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 0;max-width:1180px;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;margin-bottom:8px}
.brand{display:inline-flex;align-items:center;gap:10px;font:900 1.375rem/1 var(--display);color:var(--fg);text-decoration:none;min-height:44px}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--gold);padding:5px;display:block;box-shadow:0 2px 0 var(--gold-deep)}
.brand .mark svg{width:100%;height:100%;display:block}
.viewas{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2);max-width:100%}
.seg button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--fg);font:700 .9375rem var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg2)}
.seg-wide{display:flex}
.seg-wide button{flex:1}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1.5px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{min-height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.8125rem;border-top:3px solid transparent;margin-top:-1.5px}
.tabs a[aria-current="page"]{color:var(--fg);font-weight:700;border-top-color:var(--gold-deep)}
main{padding-bottom:calc(var(--tabs-h) + 32px + env(safe-area-inset-bottom,0px));min-width:0}
main.has-actions{padding-bottom:calc(var(--tabs-h) + 104px + env(safe-area-inset-bottom,0px))}
#view:focus{outline:none}
.page{display:flex;flex-direction:column;gap:32px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lede{font-size:1.0625rem;max-width:60ch}
.notice{background:var(--bg3);border:1px solid var(--line-soft);border-radius:8px;padding:6px 12px;margin-bottom:-16px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line-soft)}

/* controls */
.btn{min-height:44px;padding:9px 18px;border-radius:12px;font:700 1rem var(--display);border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-deep)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.btn-ghost{background:var(--bg2);color:var(--fg);border-color:var(--line)}
.btn-danger{background:var(--bg2);color:var(--pink-text);border-color:currentColor}
.btn-big{font-size:1.125rem;min-height:52px;padding:12px 22px}
.btn-full{width:100%}
.btn[aria-pressed="true"] svg.ic,.iconbtn[aria-pressed="true"] svg.ic{fill:currentColor}
.iconbtn{width:44px;height:44px;flex:none;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.iconbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg2);border-color:var(--fg)}
.linkbtn{background:none;border:0;padding:10px 0;min-height:44px;color:var(--link);font:700 1rem var(--body);text-decoration:underline;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.term{background:none;border:0;padding:6px 0;margin:0;color:inherit;font:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.legend{font-weight:700}
input[type="text"],input[type="search"],input[type="password"],select{font:400 1rem var(--body);min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);color:var(--fg);width:100%}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{padding-left:40px;padding-right:48px}
.search input::-webkit-search-cancel-button{display:none}
.search>svg.ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.search .clear{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar select{width:auto;flex:0 1 auto}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:700}
.check input,.pickrow input,.moods input,.radios input{width:22px;height:22px;flex:none}
.err{color:var(--pink-text);font-weight:700}

/* surfaces */
.card{background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--edge),0 16px 28px -20px var(--shade)}
.pad{padding:16px}
.panel{background:var(--bg2);border:1.5px dashed var(--line);border-radius:14px;padding:20px 16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-soft);font-size:.8125rem;font-weight:700;background:var(--bg3);color:var(--fg);white-space:nowrap}
.chip svg.ic{width:14px;height:14px}
.chip-lock{background:var(--fg);color:var(--bg2);border-color:var(--fg)}
.chip-exp{background:var(--tape);color:var(--tape-ink);border-color:var(--tape-ink)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font:700 .8125rem var(--body);background:var(--gold);color:var(--gold-ink)}
.badge svg.ic{width:15px;height:15px}
.badge-dark{background:var(--art-veil);color:var(--art-ink)}
.badge-exp{background:var(--tape);color:var(--tape-ink)}

.hex{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;max-width:62ch}
.hex .face{width:44px;height:44px;border-radius:12px;background:var(--art-bg);border:1.5px solid var(--line);padding:0;overflow:hidden;cursor:pointer;display:block}
.hex .face img{width:100%;height:100%;object-fit:cover;display:block}
.hex .say{background:var(--bg2);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px}
.hex .who{font-size:.8125rem;font-weight:700;color:var(--muted)}
.hex .line{font:500 1.0625rem/1.4 var(--display)}
.warn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--hazard);color:var(--hazard-ink);padding:10px 12px;border-radius:6px;border-left:8px solid var(--hazard-ink);max-width:62ch}
.warn strong{font-family:var(--display)}

/* key art banner */
.hero{overflow:hidden}
.hero-art{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--art-bg);color:var(--art-ink)}
.hero-art>img.art,.pk-art>img.art,.style-tile>img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero-art::after{content:"";position:absolute;inset:30% 0 0 0;background:linear-gradient(to bottom,rgba(9,11,24,0),rgba(9,11,24,.94))}
.hero-top{position:absolute;inset:12px 12px auto 12px;display:flex;flex-wrap:wrap;gap:6px;z-index:1}
.hero-title{position:absolute;inset:auto 16px 12px 16px;z-index:1}
.hero-title h1{font-size:clamp(1.75rem,6.4vw,3rem);text-shadow:0 2px 0 rgba(9,11,24,.7)}
.hero-body{padding:16px;display:grid;gap:16px}
.hero-side{display:flex;flex-direction:column;gap:12px}

/* playpack cards: compact rows on phones, grid posters on wide screens */
.shelf{display:grid;gap:10px}
.pk{display:grid;grid-template-columns:104px minmax(0,1fr);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;color:var(--fg);text-decoration:none;
  box-shadow:0 2px 0 var(--edge),0 12px 22px -18px var(--shade);min-width:0}
.pk-art{position:relative;display:block;min-height:104px;background:var(--art-bg)}
.crest{position:absolute;left:6px;bottom:6px;width:28px;height:28px;border-radius:7px;background:var(--art-veil);padding:5px;z-index:1;display:block}
.crest svg{width:100%;height:100%;display:block}
.pk-body{display:flex;flex-direction:column;gap:4px;padding:10px 12px;min-width:0}
.pk-name{font:700 1.0625rem/1.2 var(--display)}
.pk-blurb{font-size:.875rem;line-height:1.4;color:var(--muted)}
.pk .chips{margin-top:auto;padding-top:4px}
.tapeflag{position:absolute;left:-4px;top:10px;transform:rotate(-3deg);background:var(--tape);color:var(--tape-ink);font:900 .8125rem var(--display);padding:4px 10px 3px;box-shadow:0 2px 0 var(--tape-ink);z-index:1}
.pk .tapeflag{display:none}
.pk-wrap{position:relative;display:grid;min-width:0}
.pk-heart{position:absolute;top:8px;right:8px;z-index:1}
.pk-wrap .pk-body{padding-right:60px}
.pk-wrap .pk:hover{transform:none}

.styles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.style-tile{position:relative;overflow:hidden;min-height:84px;border-radius:12px;border:1.5px solid var(--line);background:var(--art-bg);color:var(--art-ink);cursor:pointer;padding:0;text-align:left;
  box-shadow:0 2px 0 var(--edge),0 12px 22px -18px var(--shade);display:flex;align-items:flex-end}
.style-tile:last-child{grid-column:span 2}
.style-name{position:relative;z-index:1;display:flex;flex-direction:column;width:100%;padding:22px 12px 8px;background:linear-gradient(to bottom,rgba(9,11,24,0),rgba(9,11,24,.92) 55%);font:400 1rem var(--body)}
.style-name strong{font:700 1.0625rem/1.2 var(--display)}
.dares{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dare{min-height:88px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--fg);font:400 1rem var(--body);display:flex;flex-direction:column;gap:2px;justify-content:center}
.dare .fl{display:flex;gap:1px}
.dare .fl svg.ic{width:18px;height:18px;fill:currentColor}
.dare-1 .fl{color:var(--good)} .dare-2 .fl{color:var(--warm)} .dare-3 .fl{color:var(--pink-text)}
.dare strong{font:700 1.0625rem/1.2 var(--display)}

/* pack page */
.actions{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;background:var(--bg2);border-top:1.5px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.actions .btn-primary{flex:1}
.mods{padding:0 16px}
details.fold{border-top:1px solid var(--line-soft)}
details.fold:first-child{border-top:0}
details.fold>summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font:700 1.0625rem var(--display);list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font:900 1.4rem/1 var(--display);width:28px;text-align:center;flex:none}
details.fold[open]>summary::after{content:"\2212"}
.fold-body{padding:0 0 16px;display:flex;flex-direction:column;gap:12px}
.mods .fold-body{padding:0;gap:0}
.group-about{padding-bottom:10px}
details.plain>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.steps{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.inst li{justify-content:space-between;min-height:44px;border-top:1px solid var(--line-soft)}
.inst .linkbtn{padding:0;font-size:.8125rem}
.inst .check{font-weight:400;flex:1;min-width:0}
.qrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line-soft)}
.mod{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-top:1px solid var(--line-soft)}
.tile{width:56px;height:56px;border-radius:10px;padding:9px;display:block;flex:none}
.tile svg{width:100%;height:100%;display:block}
.mod h4{font:700 1.0625rem/1.25 var(--display);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mod .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px}
.mod .meta>span{display:inline-flex;align-items:center;gap:4px}
.mod .meta svg.ic{width:16px;height:16px}
.caution{color:var(--pink-text);font-weight:700;display:flex;gap:6px;align-items:flex-start;margin-top:2px}
.caution svg.ic{width:16px;height:16px;margin-top:2px}
.why{margin-top:2px}
.tag-sample{font:700 .8125rem var(--body);border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:0 6px}
.list{padding:0 16px}
.list .mod:first-child{border-top:0}

/* build */
.grid2{display:grid;gap:12px}
.tile.tile-img{padding:0;object-fit:cover;background:var(--bg3)}
.picks{padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr);column-gap:24px}
.pickrow{display:grid;grid-template-columns:24px 40px minmax(0,1fr);gap:10px;align-items:center;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.pickrow .tile{width:40px;height:40px;padding:7px;border-radius:8px}
.empty{padding:20px 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.moods,.radios{display:flex;flex-wrap:wrap;gap:8px}
.moods label,.radios label{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer;font-weight:700}
.radios{flex-direction:column}

/* stamps */
.stamps{display:flex;flex-wrap:wrap;gap:12px}
.stamp{width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stamp .ink{width:76px;height:76px;border-radius:50%;border:4px double var(--pink-text);color:var(--pink-text);display:grid;place-items:center;transform:rotate(-8deg);padding:16px}
.stamp .ink svg{width:100%;height:100%}
.stamp.new .ink{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:rotate(-30deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

/* sheets */
dialog{border:1.5px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--fg);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 24px 48px -16px var(--shade)}
dialog::backdrop{background:rgba(8,10,22,.72)}
.sheet{padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{padding-top:8px}
.ticks{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.ticks li{display:flex;align-items:center;gap:10px;min-height:32px;color:var(--muted)}
.ticks li.done{color:var(--fg)}
.ticks li .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.ticks li.done .dot{background:var(--good);border-color:var(--good);color:var(--bg2)}
.ticks li .dot svg{width:14px;height:14px;visibility:hidden}
.ticks li.done .dot svg{visibility:visible}
.code{font:900 2rem/1 var(--display);letter-spacing:.08em;background:var(--bg3);border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;user-select:all}
.perks{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc{display:flex;flex-direction:column;gap:10px}
.doc h3{margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + 84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg2);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100vw - 32px);box-shadow:0 10px 24px -8px var(--shade)}

@media (min-width:640px){
  .shelf{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .shelf-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .styles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .style-tile{min-height:110px}
  .pk{display:flex;flex-direction:column}
  .pk:hover{transform:translateY(-2px)}
  .pk-art{aspect-ratio:16/9;min-height:0}
  .pk-body{padding:12px 14px 14px;gap:6px;flex:1}
  .pk-name{font-size:1.125rem}
  .pk .tapeflag{display:block}
  .pk-exp{display:none}
  .pk-wrap .pk-body{padding-right:14px}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .picks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-art{aspect-ratio:21/9}
  .hero-body{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;padding:22px 24px 24px;align-items:start}
  .hero-title{inset:auto 24px 18px 24px}
  .hero-top{inset:16px 16px auto 16px}
}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:184px minmax(0,1fr);column-gap:36px;padding-block:12px 0}
  .top{grid-column:1 / -1;margin-bottom:16px}
  .tabs{position:sticky;top:16px;inset:auto;align-self:start;display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0}
  .tabs a{flex-direction:row;justify-content:flex-start;gap:10px;min-height:48px;padding:0 12px;font-size:1rem;border-top:0;margin:0;border-left:3px solid transparent;border-radius:0 10px 10px 0}
  .tabs a[aria-current="page"]{border-left-color:var(--gold-deep);background:var(--bg2)}
  main,main.has-actions{padding-bottom:48px}
  .actions{position:static;background:none;border:0;padding:0;flex-wrap:wrap}

function matches(p){
  var q = S.q.trim().toLowerCase(), f = S.filter;
  if (S.fam !== "all" && p.family !== S.fam) return false;
  if (f === "exp" && p.kind !== "Experimental") return false;
  if (/^[123]$/.test(f) && p.dare !== +f) return false;
  if (!q) return true;
  var hay = (p.name + " " + p.blurb + " " + allMods(p).map(function(i){ return MOD[i].name + " " + MOD[i].tags.join(" "); }).join(" ")).toLowerCase();
  return hay.indexOf(q) > -1;
}
function resultsHtml(){
  var a = PACKS.filter(matches), c = communityPacks().filter(matches), o = "";
  if (!a.length && !c.length)
    return '<div class="panel"><h2>No playpacks match</h2><p>Try a different word, or clear the search to see the whole shelf.</p><button type="button" class="btn btn-ghost" data-action="clear">Clear the search</button></div>';
  var byName = function(x, y){ return x.name.localeCompare(y.name); };
  if (S.sort === "az") o += shelf(a.slice().sort(byName));
  else if (S.sort === "new") o += shelf(a.slice().sort(function(x, y){ return ROTA.indexOf(y.id) - ROTA.indexOf(x.id) || byName(x, y); }));
  else if (S.sort === "gentle" || S.sort === "wild") o += shelf(a.slice().sort(function(x, y){ return (S.sort === "gentle" ? x.dare - y.dare : y.dare - x.dare) || byName(x, y); }));
  else FAMILIES.forEach(function(f){
    var inFam = a.filter(function(x){ return x.family === f[0]; });
    if (inFam.length) o += '<section class="sec fam-group" aria-labelledby="h-fam-' + f[0] + '">' + head("h-fam-" + f[0], f[1]) + shelf(inFam) + "</section>";
  });
  if (c.length) o += '<section class="sec" aria-labelledby="h-comm">' + head("h-comm", "From the community") + '<p class="muted">Built and shared by members.</p>' + shelf(c) + "</section>";
  return o;
}

var CATS = (function(){ var s = {}; MODS.forEach(function(m){ m.tags.forEach(function(t){ s[t] = 1; }); }); return Object.keys(s).sort(); })();
function buildComment(){
  var n = S.draft.mods.length;
  if (n === 0) return "An empty playpack. Minimalist. Pick at least three mods.";
  if (n === 1) return "One mod is not a playpack. It is a mod with ambitions.";
  if (n === 2) return "Two mods. Almost a playpack. One more.";
  if (n <= 5) return n + " mods. Tidy. Sensible. I am a little disappointed.";
  if (n <= 12) return n + " mods. Now we are cooking.";
  if (n < 20) return n + " mods. Bold. Something will explode. I will bring snacks.";

  var list = MODS.filter(function(m){

function twoTap(b, armedLabel){

  b.setAttribute("data-armed", "1"); b.setAttribute("data-label", b.innerHTML); b.textContent = armedLabel;
  setTimeout(function(){ if (document.contains(b) && b.getAttribute("data-armed")){ b.removeAttribute("data-armed"); b.innerHTML = b.getAttribute("data-label"); } }, 6000);

}

// Installing for real: each mod is handed to the CurseForge app, which downloads it and puts it in
// Hytale's mods folder. CurseForge has no way to take a whole list at once, so it is one tap per mod.
function installedIn(p){ var got = S.installed[p.id] || []; return allMods(p).filter(function(i){ return got.indexOf(i) > -1; }); }
function markInstalled(p, id, on){
  var got = (S.installed[p.id] || []).filter(function(i){ return i !== id; }); if (on) got.push(id);
  S.installed[p.id] = got; store.set("installed", S.installed);
  if (installedIn(p).length === allMods(p).length && S.upnext.indexOf(p.id) > -1){ S.upnext = S.upnext.filter(function(x){ return x !== p.id; }); store.set("upnext", S.upnext); remember("upnext", p.id, false); }
}
function appLink(id){ return "curseforge://install?addonId=" + encodeURIComponent(String(id).replace(/^cf/, "")); }
function installBody(p){
  var ids = allMods(p), done = installedIn(p), next = ids.filter(function(i){ return done.indexOf(i) < 0; })[0];
  var top = next
    ? '<a class="btn btn-primary btn-big btn-full" id="inst-next" href="' + appLink(next) + '" data-action="instnext" data-id="' + p.id + '" data-mod="' + next + '">' + ic("down") + "Install " + esc(MOD[next].name) + "</a>" +
      '<p class="small muted" id="inst-count">' + done.length + " of " + ids.length + " installed. Each tap hands one mod to the CurseForge app.</p>"
    : '<div id="inst-done" class="sec"><p><strong>All ' + ids.length + " mods are in.</strong> One last step, because Hytale keeps mods switched off until you say so:</p>" +
      '<ol class="steps"><li>Open Hytale and go to <strong>Worlds</strong>.</li><li><strong>Right-click</strong> your world and choose <strong>Mods</strong>. For a new world, use the settings cog while creating it.</li><li>Tick the mods to switch these mods on, then choose <strong>Save World Settings</strong>.</li></ol>' +
      '<p class="small muted">Hytale has no single list of installed mods. They only show inside each world\'s Mods screen.</p>' + hex(say("installed")) +
      (S.stamps.indexOf(p.id) < 0 ? '<div><button type="button" class="btn btn-ghost" data-action="stampdone" data-id="' + p.id + '">' + ic("star") + "Played it? Stamp my card</button></div>" : '<p class="small"><strong>Stamp collected.</strong></p>') + "</div>";
  return top + '<ul class="ticks inst" id="inst-list">' + ids.map(function(i){

        '<a class="linkbtn small" href="' + esc(m.url || "https://www.curseforge.com/hytale") + '" target="_blank" rel="noopener">Page' + ic("ext") + '<span class="sr"> for ' + esc(m.name) + " (opens in a new tab)</span></a></li>"; }).join("") + "</ul>" +
    '<details class="plain"><summary>Nothing happens when I tap install</summary><p class="small">The install button needs the free CurseForge app on this computer. Open it once, then try again. You can also tap Page beside any mod and install it from its CurseForge page, then tick it off here.</p><a class="linkbtn" href="https://www.curseforge.com/download/app" target="_blank" rel="noopener">Get the CurseForge app' + ic("ext") + '<span class="sr"> (opens in a new tab)</span></a></details>';
}

function runInstall(id){
  var items = sheet.querySelectorAll("#ticks li"), out = $("#play-out", sheet), step = reduceMotion() ? 0 : 240;
  out.innerHTML = '<p role="status">Adding mods.</p>';

    out.innerHTML = '<p role="status"><strong>All ' + items.length + " mods are in. Open Hytale and play.</strong></p>" + hex(say("installed")) +
      '<div><button type="button" class="btn btn-ghost" data-action="close">Done</button></div>';

  if (!step){ items.forEach(function(li){ li.classList.add("done"); }); finish(); return; }
  items.forEach(function(li, i){ timers.push(setTimeout(function(){ li.classList.add("done"); }, step * (i + 1))); });

}

var DOCS = {
  support:["Help and contact", "<p>Stuck, or spotted something wrong? Write to us and a real person will answer.</p><p><strong>Email:</strong> to be added before release.</p><p>To report a shared playpack, open it and tap Report this playpack. We review every report within 24 hours.</p>"],
  privacy:["Privacy policy", "<p class=\"small muted\">Draft for review. Last updated November 2026.</p><h3>What we keep</h3><p>If you make an account we keep your sign-in email, the playpacks and mods you save, your stamps and anything you choose to share. Payments are handled by Stripe. We never see your card details.</p><h3>Email</h3><p>We email you only to reset a password you asked to reset, and, if you ask for it, once a week about new playpacks. Every weekly email has a link that stops them. A sending service delivers these emails for us and is given your email address for that purpose only.</p><h3>What we never do</h3><p>We do not sell or share your data. We do not show ads. We do not track you across other apps or websites.</p><h3>Children</h3><p>HyMeta is kept clean so it is safe for younger players to browse. Accounts and sharing are for ages 13 and up. We do not knowingly collect personal information from children under 13, and we delete it if we find any.</p><h3>Your choices</h3><p>You can delete your account, and everything in it, at any time from You, Account, Delete my account. Deleted data is removed within 30 days.</p><h3>Contact</h3><p>Lumina Art House, LLC. Contact email to be added before release.</p>"],
  terms:["Terms of use", "<p class=\"small muted\">Draft for review. Last updated November 2026.</p><h3>What HyMeta is</h3><p>HyMeta is an unofficial guide to Hytale mods. It suggests sets of mods and links to their CurseForge pages. It is not made, endorsed or supported by Hypixel Studios, CurseForge or Overwolf.</p><h3>Mods belong to their creators</h3><p>Every mod, name and logo shown belongs to the person who made it. Mods are downloaded from CurseForge under its own terms. We cannot promise that any mod works, or that mods work together.</p><h3>Membership</h3><p>Membership is an auto-renewing subscription at $3.99 a month or $24.99 a year, paid through Stripe. It renews until you cancel, which you can do at any time under You.</p><h3>Accounts</h3><p>You must be 13 or older to make an account or share a playpack.</p><h3>Sharing</h3><p>Anything you share must follow the community rules. A person reviews every playpack before other members see it. We may remove content or close accounts that break the rules.</p><h3>Governing law</h3><p>These terms are governed by the laws of the State of Florida, United States.</p><h3>Owner</h3><p>HyMeta is owned and run by Lumina Art House, LLC. &copy; 2026 Lumina Art House, LLC. All rights reserved.</p>"],
  rules:["Community rules", "<p>Shared playpacks are seen by other players, including children. Keep it friendly.</p><ul class=\"perks\"><li>Be kind. No insults, bullying or hate.</li><li>Keep it clean. No swearing or grown-up content.</li><li>Stay private. No real names, links, emails, phone numbers or addresses.</li><li>Be honest. No scams, spam or pretending to be someone else.</li></ul><p>A person checks every playpack before other members can see it. Break the rules and your playpack is removed. Do it again and your account is closed.</p><p>See something wrong? Open the playpack and tap Report this playpack, or block the member who shared it. We review every report within 24 hours.</p>"],
  credits:["Copyright and credits", "<p>&copy; 2026 Lumina Art House, LLC. All rights reserved.</p><p>HyMeta is an unofficial fan app. Hytale is a trademark of Hypixel Studios. CurseForge is a trademark of Overwolf. HyMeta is not affiliated with or endorsed by either company.</p><p>Every mod belongs to its creator. Mod names, logos and details come from CurseForge.</p><p>In this preview, all mods, authors, download counts and artwork are placeholders.</p>"]
};
function openDoc(k){ var d = DOCS[k]; if (d) openSheet(d[0], '<div class="doc">' + d[1] + '</div><div><button type="button" class="btn btn-ghost" data-action="close">Close</button></div>'); }
function openTerm(t){ var g = GLOSS[t]; if (g) openSheet(g[0], "<p>" + g[1] + '</p><div><button type="button" class="btn btn-ghost" data-action="close">Got it</button></div>'); }
function openLeave(){
  openSheet("Leave without sending?", "<p>Your playpack has not been sent for review. If you leave now, it will be lost.</p>" +
    '<div class="row"><button type="button" class="btn btn-primary" data-action="close">Keep building</button><button type="button" class="btn btn-danger" data-action="leave">Leave and lose it</button></div>');
}
function openReport(id){
  openSheet("Report this playpack", '<form id="report" data-id="' + id + '" class="sec" novalidate><div class="radios" role="radiogroup" aria-label="What is wrong?">' +
    ["Rude or hurtful","Shares personal information","Spam or a scam","Something else"].map(function(r, i){ return '<label><input type="radio" name="why" value="' + i + '"' + (i === 0 ? " checked" : "") + ">" + r + "</label>"; }).join("") +
    '</div><p class="small muted">We review every report within 24 hours. The playpack is hidden for you right away.</p><div class="row"><button type="submit" class="btn btn-primary">Send report</button></div></form>');
}
function openSignin(){
  openSheet("Sign in", "<p>An account keeps your saved playpacks, mods and stamps on every device.</p>" +
    '<div class="row"><button type="button" class="btn btn-ghost" data-action="soon">Sign in with Apple</button><button type="button" class="btn btn-ghost" data-action="soon">Sign in with email</button></div>' +
    '<p class="small muted">Accounts are for ages 13 and up. You can browse without one. Preview only. Sign-in is not connected yet.</p>');
}
var toastTimer;
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 3200); }
function toggle(list, key, id){ var i = list.indexOf(id); if (i > -1) list.splice(i, 1); else list.push(id); store.set(key, list); remember(key, id, i < 0); return i < 0; }

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-action]"); if (!b) return;
  var a = b.getAttribute("data-action"), id = b.getAttribute("data-id"), p;
  if (a === "tier" && S.billing) return;
  if (a === "tier"){ S.tier = b.getAttribute("data-tier"); store.set("tier", S.tier); closeSheet(); render(false); toast(S.tier === "member" ? "Now showing the member view" : "Now showing the free view"); }
  else if (a === "play") openPlay(id);
  else if (a === "playmode") openPlay(id, b.getAttribute("data-mode"));
  else if (a === "install") runInstall(id);
  else if (a === "instnext"){ p = findPack(id); markInstalled(p, b.getAttribute("data-mod"), true); setTimeout(function(){ if (sheet.open){ openSheet("Play " + esc(p.name), playBody(p, "here")); var nx = $("#inst-next") || $("#sheet-title"); nx.focus(); } }, 60); }
  else if (a === "stampdone"){ p = findPack(id); if (S.stamps.indexOf(id) < 0){ S.stamps.push(id); remember("stamps", id, true); store.set("stamps", S.stamps); } render(false); openSheet("Play " + esc(p.name), playBody(p, "here")); toast("Stamp collected"); }
  else if (a === "quip"){ var ql = QUIPS[S.mood]; quipAt = (quipAt + 1) % ql.length; toast("Hex: " + ql[quipAt]); }
  else if (a === "code") openCode();
  else if (a === "unqueue"){ S.upnext = S.upnext.filter(function(x){ return x !== id; }); store.set("upnext", S.upnext); remember("upnext", id, false); render(false); toast("Removed from waiting"); }
  else if (a === "welcome"){ S.welcomed = true; store.set("welcomed", true); render(true); }
  else if (a === "surprise"){
    var pool = PACKS.concat(communityPacks()).filter(function(x){ return !isLocked(x) && x.id !== current.replace("pack-", ""); });
    if (!pool.length) pool = PACKS.slice();
    p = pool[Math.floor(Math.random() * pool.length)]; toast("Hex picked " + p.name + ". No take-backs."); location.hash = "pack-" + p.id;
  }
  else if (a === "join") openJoin();
  else if (a === "gate") openGate();
  else if (a === "pay"){
    S.plan = (sheet.querySelector('input[name="plan"]:checked') || {}).value === "month" ? "month" : "year";
    if (!S.user){ openAccount("signup"); toast("Make an account first. Your membership lives on it."); } else openGate();
  }
  else if (a === "portal") post({ op:"portal" }, "api/billing").then(function(d){ location.href = d.url; }, function(e){ toast(e.message); });
  else if (a === "restore") toast("Nothing to restore in this preview");
  else if (a === "soon") toast("Not connected in this preview");
  else if (a === "signin"){ if (S.accounts) openAccount("login"); else openSignin(); }
  else if (a === "signup") openAccount("signup");
  else if (a === "forgot") openForgot();
  else if (a === "testnews"){ b.disabled = true; post({ op:"test" }, "api/mail").then(function(){ b.disabled = false; toast("Test sent. Check your inbox."); }, function(e){ b.disabled = false; toast(e.message); }); }
  else if (a === "acctmode") openAccount(b.getAttribute("data-mode"));
  else if (a === "signout") post({ op:"logout" }).catch(function(){}).then(function(){ forgetLocal(); render(false); toast("Signed out"); });
  else if (a === "doc") openDoc(b.getAttribute("data-doc"));
  else if (a === "term") openTerm(b.getAttribute("data-term"));
  else if (a === "close") closeSheet();
  else if (a === "leave"){ S.dirty = false; S.draft = { name:"", blurb:"", mods:[] }; S.bq = ""; S.bcat = "all"; S.bonly = false; closeSheet(); location.hash = pending || "home"; }
  else if (a === "save"){ var on = toggle(S.saved, "saved", id); render(false); toast(on ? "Playpack saved" : "Removed from saved"); }
  else if (a === "savemod"){ var on2 = toggle(S.savedMods, "savedMods", id); render(false); toast(on2 ? "Mod saved" : "Removed from saved"); }
  else if (a === "savedtab"){ S.savedTab = b.getAttribute("data-tab"); render(false); }
  else if (a === "dare"){ S.filter = b.getAttribute("data-dare"); S.fam = "all"; S.q = ""; location.hash = "explore"; }
  else if (a === "family"){ S.fam = b.getAttribute("data-family"); S.filter = "all"; S.q = ""; location.hash = "explore"; }
  else if (a === "approve"){ p = findPack(id); if (p){ p.status = "approved"; store.set("mine", S.mine); render(false); toast("Approved. Other members can see it now."); } }
  else if (a === "stamp"){ if (S.stamps.indexOf(id) < 0) { S.stamps.push(id); remember("stamps", id, true); } store.set("stamps", S.stamps); S.justStamped = id; render(false); toast("Stamp collected"); }
  else if (a === "clear"){ S.q = ""; S.filter = "all"; S.fam = "all"; render(false); var q = $("#q"); if (q) q.focus(); }
  else if (a === "bqclear"){ S.bq = ""; var bq = $("#bq"); bq.value = ""; $("#bq-clear").hidden = true; if (LIVE) liveSearch(); $("#b-list").innerHTML = pickList(); bq.focus(); }
  else if (a === "retry"){ p = findPack(id); loadPack(p); render(false); }
  else if (a === "bclear"){ S.bq = ""; S.bcat = "all"; S.bonly = false; render(false); var bq2 = $("#bq"); if (bq2) bq2.focus(); }
  else if (a === "copy"){
    var text = b.getAttribute("data-text"), ok = function(){ toast("Code copied"); }, fail = function(){ var r = document.createRange(); r.selectNodeContents($("#code")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Code selected. Copy it from here."); };
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (err) { fail(); }
  }
  else if (a === "review"){ var okd = b.getAttribute("data-ok") === "1"; cpost({ op:"review", id:id, approve:okd }).then(function(){ toast(okd ? "Approved. Every member can see it now." : "Not approved. Only its builder can see it."); return loadCommunity(); }, function(e){ toast(e.message); }); }
  else if (a === "dismiss") cpost({ op:"dismiss", id:id }).then(function(){ toast("Report cleared. The playpack stays."); return loadCommunity(); }, function(e){ toast(e.message); });
  else if (a === "report") openReport(id);
  else if (a === "block"){
    if (!twoTap(b, "Tap again to block")) return;
    if (serverMode()){ cpost({ op:"block", id:id }).then(function(){ toast("Member blocked. Their playpacks are hidden."); return loadCommunity(); }, function(e){ toast(e.message); }).then(function(){ location.hash = "explore"; }); return; }
    p = findPack(id); if (p && S.blocked.indexOf(p.by) < 0) S.blocked.push(p.by); store.set("blocked", S.blocked); toast("Member blocked. Their playpacks are hidden."); location.hash = "explore";
  }
  else if (a === "unblock" && serverMode()) cpost({ op:"unblock", author:b.getAttribute("data-by") }).then(function(){ toast("Member unblocked"); return loadCommunity(); }, function(e){ toast(e.message); });
  else if (a === "unblock"){ S.blocked = S.blocked.filter(function(x){ return x !== b.getAttribute("data-by"); }); store.set("blocked", S.blocked); render(false); toast("Member unblocked"); }
  else if (a === "delacct" && S.user){
    if (!twoTap(b, "Tap again to delete everything")) return;
    post({ op:"delete" }).then(function(){ forgetLocal(); render(false); toast("Your account and everything in it has been deleted"); }, function(e){ toast(e.message); });
  }
  else if (a === "delacct"){ if (!twoTap(b, "Tap again to delete everything")) return; b.removeAttribute("data-armed"); b.innerHTML = b.getAttribute("data-label"); toast("In the real app this deletes your account and all its data"); }
  else if (a === "reset"){
    if (!twoTap(b, "Tap again to clear everything")) return;
    ["saved","savedMods","stamps","mine","hidden","blocked"].forEach(function(k){ S[k] = []; store.set(k, []); }); render(false); toast("Preview data cleared");
  }
  else if (a === "del"){
    if (!twoTap(b, "Tap again to delete")) return;
    if (serverMode()){ cpost({ op:"delete", id:id }).then(function(){ toast("Playpack deleted"); return loadCommunity(); }, function(e){ toast(e.message); }).then(function(){ location.hash = "explore"; }); return; }
    S.mine = S.mine.filter(function(x){ return x.id !== id; }); S.saved = S.saved.filter(function(x){ return x !== id; });
    store.set("mine", S.mine); store.set("saved", S.saved); toast("Playpack deleted"); location.hash = "explore";
  }
});
document.addEventListener("input", function(e){
  var t = e.target;
  if (t.id === "q"){ S.q = t.value; $("#q-clear").hidden = !S.q; $("#results").innerHTML = resultsHtml(); }
  else if (t.id === "bq"){ S.bq = t.value; $("#bq-clear").hidden = !S.bq; if (LIVE) liveSearch(); $("#b-list").innerHTML = pickList(); }
  else if (t.id === "b-name"){ S.draft.name = t.value; S.dirty = true; }
  else if (t.id === "b-blurb"){ S.draft.blurb = t.value; S.dirty = true; }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "filter"){ S.filter = t.value; $("#results").innerHTML = resultsHtml(); }
  else if (t.id === "fam"){ S.fam = t.value; $("#results").innerHTML = resultsHtml(); }
  else if (t.id === "bcat"){ S.bcat = t.value; $("#b-list").innerHTML = pickList(); }
  else if (t.id === "bonly"){ S.bonly = t.checked; $("#b-list").innerHTML = pickList(); }
  else if (t.getAttribute("data-inst")){ var ip = findPack(t.getAttribute("data-inst")); markInstalled(ip, t.value, t.checked); openSheet("Play " + esc(ip.name), playBody(ip, "here")); var back = sheet.querySelector('input[value="' + t.value + '"]'); if (back) back.focus(); }
  else if (t.id === "sort"){ S.sort = t.value; $("#results").innerHTML = resultsHtml(); }
  else if (t.id === "news-on"){ var want = t.checked; post({ op:"news", on:want }).then(function(){ S.user.news = want; toast(want ? "Weekly email is on" : "Weekly email is off"); }, function(){ t.checked = !want; toast("That did not save. Check your connection."); }); }
  else if (t.id === "theme"){ S.theme = t.value; store.set("theme", S.theme); applyTheme(); }
  else if (t.name === "mood"){ S.mood = t.value; store.set("mood", S.mood); $("#mood-sample").innerHTML = hex(say("greet")); }
  else if (t.name === "mods"){
    var i = S.draft.mods.indexOf(t.value);
    if (t.checked && i < 0 && S.draft.mods.length >= 20){ t.checked = false; toast("A playpack holds up to 20 mods"); return; }
    if (t.checked && i < 0) S.draft.mods.push(t.value); else if (!t.checked && i > -1) S.draft.mods.splice(i, 1);
    S.dirty = true; $("#b-status").innerHTML = buildStatus();
  }
});
document.addEventListener("toggle", function(e){ var d = e.target; if (d.classList && d.classList.contains("fold") && d.id) S.open[d.id] = d.open; }, true);
document.addEventListener("submit", function(e){
  var f = e.target; e.preventDefault();
  if (f.id === "codeform"){
    var cerr = $("#code-err"); cerr.hidden = true;
    api("api/handoff?code=" + encodeURIComponent($("#code-in").value)).then(function(d){
      if (!d.enabled || !findPack(d.pack)){ cerr.textContent = "That playpack is not available here."; cerr.hidden = false; return; }
      closeSheet(); location.hash = "pack-" + d.pack; setTimeout(function(){ openPlay(d.pack, "here"); }, 250);
    }, function(){ cerr.textContent = "That code is not right, or it is more than a day old. Make a new one on your phone."; cerr.hidden = false; $("#code-in").focus(); });
  }
  else if (f.id === "acct"){
    var aerr = $("#a-err"), up = f.getAttribute("data-mode") === "signup", btn = f.querySelector('button[type="submit"]');
    var body = { op: up ? "signup" : "login", email: $("#a-email").value, password: $("#a-pass").value };
    if (up){ body.name = $("#a-name").value; body.over13 = $("#a-age").checked; body.news = !!($("#a-news") && $("#a-news").checked); }
    btn.disabled = true; aerr.hidden = true;
    post(body).then(function(){ return loadAccount(true); }).then(function(){ closeSheet(); toast(up ? "Account made. You are signed in." : "Signed in"); },
      function(e){ btn.disabled = false; aerr.textContent = e.message; aerr.hidden = false; aerr.focus && $("#a-email").focus(); });
  }
  else if (f.id === "forgot"){
    var ferr = $("#fg-err"), fbtn = f.querySelector('button[type="submit"]'), fmail = $("#fg-email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fmail)){ ferr.textContent = "Enter the email on your account."; ferr.hidden = false; $("#fg-email").focus(); return; }
    fbtn.disabled = true; ferr.hidden = true;
    post({ op:"forgot", email:fmail }, "api/mail").then(function(){
      openSheet("Check your email", '<p id="fg-sent">If that email has a HyMeta account, a link is on its way. It works once, for one hour.</p><p class="muted">Nothing after a few minutes? Look in your spam folder, then try again.</p>' +
        '<div><button type="button" class="btn btn-ghost" data-action="close">Done</button></div>');
    }, function(e){ fbtn.disabled = false; ferr.textContent = e.message; ferr.hidden = false; });
  }
  else if (f.id === "gate"){
    var inp = $("#gate-in"), err = $("#gate-err");
    if (parseInt(inp.value, 10) !== gateAnswer){ err.textContent = "That is not it. Ask a grown-up to try."; err.hidden = false; inp.focus(); return; }
    if (S.billing){
      var gbtn = f.querySelector('button[type="submit"]'); gbtn.disabled = true; err.hidden = true;
      startCheckout().catch(function(e){ gbtn.disabled = false; err.textContent = e.message; err.hidden = false; });
      return;
    }
    S.tier = "member"; store.set("tier", "member"); closeSheet(); render(false); toast("Now showing the member view");
  }
  else if (f.id === "report"){
    var rid = f.getAttribute("data-id");
    if (serverMode()){
      var why = (f.querySelector('input[name="why"]:checked') || {}).value || 3;
      cpost({ op:"report", id:rid, why:why }).then(function(){ closeSheet(); toast("Report sent. We review reports within 24 hours."); return loadCommunity(); }, function(e){ toast(e.message); }).then(function(){ location.hash = "explore"; });
      return;
    }
    if (S.hidden.indexOf(rid) < 0) S.hidden.push(rid); store.set("hidden", S.hidden);
    closeSheet(); toast("Report sent. We review reports within 24 hours."); location.hash = "explore";
  }
  else if (f.id === "build"){
    var berr = $("#b-err"), name = S.draft.name.trim(), blurb = S.draft.blurb.trim(), personal = /(https?:|www\.|@|\.(com|net|org|gg)\b|\d{7,})/i;
    var msg = !name ? "Give your playpack a name." : personal.test(name + " " + blurb) ? "Leave out links, emails and phone numbers." : S.draft.mods.length < 3 ? "Pick at least three mods." : "";
    if (msg){ berr.textContent = msg; berr.hidden = false; (S.draft.mods.length < 3 && name && !personal.test(name + " " + blurb) ? $("#bq") : $("#b-name")).focus(); return; }
    if (serverMode()){
      var sendBtn = f.querySelector('button[type="submit"]'); sendBtn.disabled = true; berr.hidden = true;
      cpost({ op:"submit", name:name, blurb:blurb, mods:S.draft.mods.slice() }).then(function(d){
        S.dirty = false; S.draft = { name:"", blurb:"", mods:[] }; S.bq = ""; S.bcat = "all"; S.bonly = false;
        return loadCommunity().then(function(){ toast("Sent for review"); location.hash = "pack-" + d.id; });
      }, function(e){ sendBtn.disabled = false; berr.textContent = e.message; berr.hidden = false; $("#b-name").focus(); });
      return;
    }
    var first = MOD[S.draft.mods[0]];
    var np = { id:"mine-" + Date.now().toString(36), name:name, kind:"Community", by:"you", status:"pending", family:"everything", art:first.icon === "paw" ? "creatures" : first.icon === "sword" ? "combat" : first.icon === "bolt" ? "magic" : first.icon === "house" ? "building" : first.icon === "compass" ? "exploration" : "hero", dare:S.draft.mods.length > 6 ? 2 : 1, icon:first.icon, sky:NIGHT, moon:"#ffe2a0", hills:HILLS,
      blurb:blurb || "A playpack built by a member.", warning:"Built by a member. Hex has not checked under the floorboards.", pitch:null, core:S.draft.mods.slice(), spice:[] };
    S.mine.push(np); store.set("mine", S.mine); S.dirty = false; S.draft = { name:"", blurb:"", mods:[] }; S.bq = ""; S.bcat = "all"; S.bonly = false;
    toast("Sent for review"); location.hash = "pack-" + np.id;
  }
});
window.addEventListener("beforeunload", function(e){ if (S.dirty){ e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("hashchange", onRoute);

$("#mark").innerHTML = px(PACKMARK, { "#":"#1d1503", "o":"#7a5200" });
applyTheme();
current = routeName();
render(false);
if (document.querySelector('meta[name="hymeta-server"]')) api("api/health").then(function(d){ if (d && d.week && d.week.released){ setWeek(d.week); render(false); } if (d && d.live) goLive(); }).catch(function(){});
})();
</script>
